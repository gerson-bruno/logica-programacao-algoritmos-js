<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculo do Peso Ideal</title>
    <script src="js/4-2.js" defer></script>
  </head>

  <body>
    <img src="img/exe4-2.png" alt="Balança de Peso" />
      
    <h1>Programa Cálculo do Peso Ideal</h1>
      
    <form>
          
      <p>Nome:       <input type="text" id="inNome" required />     </p>
          
      <p>
        Sexo:       <input
          type="radio"
          name="sexo"
          id="inMasculino"
          required
        /> Masculino       <input
          type="radio"
          name="sexo"
          id="inFeminino"
          required
        /> Feminino     
      </p>
          
      <p>
        Altura:       <input
          type="number"
          min="0"
          step="0.01"
          id="inAltura"
          required
        />
            
      </p>
          <input type="submit" value="Calcular Peso Ideal" />     <input
        type="reset"
        value="Limpar Campos"
      />
       
    </form>
      
    <h3></h3>
  </body>
</html>
