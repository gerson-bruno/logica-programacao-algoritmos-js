<!DOCTYPE html>

    <title>Programa Contas do Mês</title>

<body>
    <h1>Programa Contas do Mês</h1>
    <p>Bem-vindo ao Programa Contas do Mês!</p>
    <form>
        <p>Descrição da conta: <input type="text" name="inDescricao" placeholder="Digite a descrição da conta" required></p>

        <p><input type="submit" value="Adicionar Conta"></p>
    </form>
<pre id="outResp1"></pre>
<pre id="outResp2"></pre>
