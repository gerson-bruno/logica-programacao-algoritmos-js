<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de variáveis</title>
</head>
<body>
    <h1>Tipos de variáveis</h1>
</body>
<script>
    const fruta = 'Banana';
    const numero = 10;
    const booleano = true;
    let indefinida;
    console.log('Fruta:', fruta); //string
    console.log('Número:', numero); //number
    console.log('Booleano:', booleano); //boolean
    console.log('Indefinida:', indefinida); //undefined
</script>
</html>
