<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular o valor total (do jantar)</title>
</head>
<body>
    <h1>Calcular o valor total (do jantar)</h1>
</body>

<script>
    const jantar = parseFloat(prompt("Digite o valor do jantar:"));
    const taxaServico = jantar * 0.1; // 10% de taxa de serviço
    const valorTotal = jantar + taxaServico;
    alert(`O valor total do jantar, incluindo a taxa de serviço, é: ${valorTotal.toFixed(2)}`);
</script>
</html>
