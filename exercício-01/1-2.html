<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada de dados e uso de variáveis</title>
</head>
<body>
    <h1>Entrada de dados e uso de variáveis</h1>
    <p>Escreva um programa que solicite ao usuário seu nome e idade, e depois exiba uma mensagem personalizada usando essas informações.</p>

    <script>
        // Solicita o nome do usuário
        const nome = prompt("Por favor, digite seu nome:");

        // Solicita a idade do usuário
        const idade = prompt("Por favor, digite sua idade:");

        // Exibe uma mensagem personalizada usando as informações fornecidas
        alert(`Olá, ${nome}! Você tem ${idade} anos.`);
    </script>
</body>
</html>
