<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operações envolvendo Strings e Números</title>
</head>
<body>
    <h1>Operações envolvendo Strings e Números</h1>
</body>

<script>
    const a = '20';
    const b = a * 2; // b = 40
    const c = a / 2 // c = 10
    const d = a - 2; // d = 18
    const e = a + 2; // e = '202'
    alert('e: ' + e); // Exibe o valor de uma variável

</script>
</html>
