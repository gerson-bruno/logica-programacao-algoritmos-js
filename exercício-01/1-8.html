<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo da duração de horas de uma viagem</title>
</head>
<body>
    <h1>Cálculo da duração de horas de uma viagem</h1>
</body>
<script>
    const dias = Number(prompt("Digite a quantidade de dias da viagem:"));
    const horas = Number(prompt("Digite a quantidade de horas da viagem:"));
    const totalHoras = (dias * 24) + horas;
    alert(`A duração total da viagem é de ${totalHoras} horas.`);
</script>
</html>
