<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lan House JS</title>
</head>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    h1 {
        color: #333;
    }

    form {
        margin-top: 20px;
    }

    label {
        display: block;
        margin-bottom: 5px;
    }

    input {
        width: 200px;
        padding: 8px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    button {
        padding: 10px 20px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    button:hover {
        background-color: #218838;
    }

    .outResp {
        margin-top: 20px;
        font-size: 18px;
        color: #555;
    }
</style>
<body>
    <h1>Lan House JS</h1>
    <p>Bem-vindo à Lan House JS! Aqui você pode jogar online e desfrutar de uma experiência de gaming incrível.</p>
    <form>
        <label>Valor por 15min de uso em R$:</label>
        <input type="number" id="inValor" name="inValor" step="0.01">
        <label>Tempo de uso em minutos:</label>
        <input type="number" id="inTempo" name="inTempo" step="1">
        <button type="submit">Calcular Valor Total</button>
    </form>
    <div class="outResp" id="outResp"></div>
</body>

<script>
    const form = document.querySelector('form');
    const outResp = document.getElementById('outResp');

    form.addEventListener('submit', (e) => {
        e.preventDefault();

        const valor = parseFloat(document.querySelector('#inValor').value);
        const tempo = parseInt(document.querySelector('#inTempo').value);

        const valorTotal = (tempo / 15) * valor;
        outResp.textContent = `Valor Total: R$ ${valorTotal.toFixed(2)}`;
    })
</script>
</html>
