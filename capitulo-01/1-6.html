<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma de dois números</title>
</head>
<body>
    <h1>Soma de dois números</h1>
</body>

<script>
    const num1 = parseFloat(prompt("Digite o primeiro número:"));
    const num2 = parseFloat(prompt("Digite o segundo número:"));
    const soma = num1 + num2;
    alert(`A soma de ${num1} e ${num2} é: ${soma}`);

    // INT - parseInt() - Converte uma string para um número inteiro.
    // FLOAT - parseFloat() - Converte uma string para um número de ponto flutuante (decimal).
</script>
</html>
